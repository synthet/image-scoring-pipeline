# Curated MCP action registry (PR1 read-only diagnostics). Regenerate:
#   python scripts/generate_mcp_tool_inventory.py --update-action-registry

version: 1
repo: backend

field_weights:
  action_id: 4.0
  title: 3.0
  aliases: 2.5
  tags: 2.0
  intent_examples: 2.5
  description: 1.0
  argument_names: 1.5

actions:
  diagnostics.run_doctor:
    title: Run backend doctor checks
    description: Local health check (config, DB, pgvector, optional GPU). Same as scripts/doctor.py.
    category: diagnostics
    tags: [doctor, health, config, database, gpu]
    aliases: [run doctor, health check, sanity check]
    intent_examples:
      - run doctor without GPU
      - check backend health
      - is the system configured correctly
    side_effect_level: read_only
    confirmation_required: false
    dry_run_supported: false
    dispatch_enabled: true
    review_required: false
    compact_profile_exposure: true
    version: 1
    deprecated: false
    canonical_docs: [docs/DIAGNOSTICS.md]
    api_contract_refs: []
    auth_or_policy_requirements: []
    input_schema:
      type: object
      properties:
        no_gpu:
          type: boolean
          description: Skip CUDA/GPU probe
        json:
          type: boolean
          description: Return structured JSON instead of formatted report text
      additionalProperties: false
    canonical_backend_handler:
      kind: python_callable
      module: modules.doctor_cli
      function: run_doctor
    legacy_tool_name: null
    test_refs: [tests/test_mcp_dispatch.py::test_dispatch_run_doctor]

