# Hand-maintained MCP tool metadata for BM25 routing. Domains map to MCP_TOOL_PROFILE values.
# Regenerate mcp/tool_catalog.json via: python scripts/generate_mcp_tool_inventory.py --update-catalog

version: 1
repo: backend

field_weights:
  name: 3.0
  tags: 2.0
  description: 1.0
  examples: 2.0
  args_summary: 1.5

domains:
  diagnostics:
    server: is-be-diag
  jobs:
    server: is-be-jobs
  data:
    server: is-be-data
  maintenance:
    server: is-be-maint

tools:
  get_database_stats:
    domain: data
    tags: [database, stats, counts, scores]
    examples: [how many images, database overview, score distribution]
  query_images:
    domain: data
    tags: [images, list, filter, scores, rating]
    examples: [find images with high score, list images in folder, filter by rating]
  get_image_details:
    domain: data
    tags: [image, details, metadata, file_path]
    examples: [details for one image, image row by path]
  search_images_by_hash:
    domain: data
    tags: [hash, duplicate, content hash, lookup]
    examples: [find image by sha256, lookup content hash]
  get_db_schema:
    domain: data
    tags: [schema, tables, columns, sql]
    examples: [list postgres tables, column names for images]
  execute_sql:
    domain: data
    tags: [sql, select, query, postgres]
    examples: [run select query, custom sql read only]
  get_folder_tree:
    domain: data
    tags: [folders, tree, hierarchy, counts]
    examples: [folder structure, images per folder]
  get_newly_imported_folders:
    domain: data
    tags: [import, folders, recent, discovery]
    examples: [recently imported folders, new library paths]
  get_stacks_summary:
    domain: data
    tags: [stacks, clusters, culling, similarity]
    examples: [stack sizes, cluster summary]
  validate_file_paths:
    domain: data
    tags: [paths, missing files, filesystem, integrity]
    examples: [missing files on disk, path validation]
  get_location_stats:
    domain: data
    tags: [gps, geocode, exif, location]
    examples: [gps coverage, geocoded images count]
  get_embedding_stats:
    domain: data
    tags: [embeddings, vectors, pgvector, coverage]
    examples: [how many embeddings, missing vectors]
  check_stack_invariants:
    domain: data
    tags: [stacks, integrity, orphans, invariants]
    examples: [orphan stacks, singleton stacks]
  search_similar_images:
    domain: data
    tags: [similarity, embeddings, cosine, neighbors]
    examples: [images similar to example, visual neighbors]
  search_images_by_text:
    domain: data
    tags: [semantic, clip, text search, captions]
    examples: [find sunset photos, text to image search]
  find_near_duplicates:
    domain: data
    tags: [duplicates, near duplicate, similarity]
    examples: [near duplicate pairs in folder]
  find_outliers:
    domain: data
    tags: [outliers, atypical, embeddings, z-score]
    examples: [unusual images in folder]

  get_incomplete_images:
    domain: jobs
    tags: [incomplete, missing scores, quality]
    examples: [images missing scores or rating]
  get_failed_images:
    domain: jobs
    tags: [failed, missing scores, quality analysis]
    examples: [images that failed scoring, missing musiq scores]
  get_recent_jobs:
    domain: jobs
    tags: [jobs, runs, history, recent]
    examples: [recent scoring runs, last jobs]
  get_job_details:
    domain: jobs
    tags: [job, run, status, details]
    examples: [job 123 details, run status by id]
  get_job_phases:
    domain: jobs
    tags: [phases, pipeline, job stages]
    examples: [phase plan for run, scoring phase status]
  get_job_stage_images:
    domain: jobs
    tags: [job, images, phase, per-image]
    examples: [images in scoring phase for job]
  get_run_diagnostics:
