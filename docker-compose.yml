services:
  db:
    image: pgvector/pgvector:pg17
    container_name: image-scoring-postgres
    shm_size: 512mb
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=image_scoring
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: image-scoring:latest
    container_name: image-scoring-webui
    ports:
      - "7860:7860"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DOCKER_CONTAINER=1
      - WEBUI_HOST=0.0.0.0
      - GEMINI_CLI_TRUST_WORKSPACE=true
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTIGRAVITY_API_KEY=${ANTIGRAVITY_API_KEY:-}
      # Postgres: `db` service + depends_on healthcheck — no Firebird wait unless WAIT_FOR_FIREBIRD=1
      # FDB at repo root when `.:/app` is mounted (set FIREBIRD_WIN_DB_PATH in `.env` to override)
      - FIREBIRD_WIN_DB_PATH=/app/SCORING_HISTORY.FDB
      - FIREBIRD_CLIENT_LIBRARY=/app/FirebirdLinux/Firebird-5.0.0.1306-0-linux-x64/opt/firebird/lib/libfbclient.so
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=image_scoring
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      # Thumbnail paths in Postgres: map container /app to host (set in `.env`; see .env.example).
      - IMAGE_SCORING_HOST_PROJECT_WSL=${IMAGE_SCORING_HOST_PROJECT_WSL:-}
      - IMAGE_SCORING_HOST_PROJECT_WIN=${IMAGE_SCORING_HOST_PROJECT_WIN:-}
    volumes:
      - .:/app
      # Host folder → /mnt/d/Photos inside the container (keep UI paths as /mnt/d/Photos/...).
      # WSL / docker CLI in WSL: default PHOTOS_BIND_SOURCE=/mnt/d/Photos works.
      # Docker Desktop on Windows: create .env with PHOTOS_BIND_SOURCE=D:/Photos (your real drive/path).
      - ${PHOTOS_BIND_SOURCE:-/mnt/d/Photos}:/mnt/d/Photos:rw
      # Gemini CLI OAuth (run `gemini auth` on the host once; set GEMINI_CONFIG_SOURCE in `.env`).
      # Fallback stub keeps `docker compose up` working when agent cull is not configured.
      - ${GEMINI_CONFIG_SOURCE:-./.agent/docker-gemini-stub}:/root/.gemini:rw
    # Make GPU usage work with non-Swarm `docker compose`
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  db-e2e:
    image: pgvector/pgvector:pg17
    container_name: image-scoring-postgres-e2e
    shm_size: 512mb
    ports:
      - "5433:5432"
    profiles:
      - e2e-inference
    environment:
      - POSTGRES_DB=image_scoring_test
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_e2e_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  inference-e2e:
    build:
      context: .
      dockerfile: Dockerfile
    image: image-scoring:latest
    container_name: image-scoring-inference-e2e
    profiles:
      - e2e-inference
    depends_on:
      db-e2e:
        condition: service_healthy
    environment:
      - DOCKER_CONTAINER=1
      - WEBUI_HOST=127.0.0.1
      - POSTGRES_HOST=db-e2e
      - POSTGRES_PORT=5432
      - POSTGRES_DB=image_scoring_test
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - WEBUI_OPEN_UI=0
    volumes:
      - ./tests:/app/tests
      - ./scripts:/app/scripts
    entrypoint: ["/bin/bash", "scripts/docker_inference_e2e.sh"]
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Interactive / one-shot GPU shell for scripts & research (WSL ~/.venvs/tf parity).
  # Does not start WebUI. Opt-in: docker compose --profile gpu-shell up -d db gpu-shell
  gpu-shell:
    build:
      context: .
      dockerfile: Dockerfile
    image: image-scoring:latest
    container_name: image-scoring-gpu-shell
    profiles:
      - gpu-shell
    shm_size: 1gb
    working_dir: /app
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DOCKER_CONTAINER=1
      - PYTHONPATH=/app
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=image_scoring
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - IMAGE_SCORING_HOST_PROJECT_WSL=${IMAGE_SCORING_HOST_PROJECT_WSL:-}
      - IMAGE_SCORING_HOST_PROJECT_WIN=${IMAGE_SCORING_HOST_PROJECT_WIN:-}
      # Optional: INSTALL_STUDENT_SCORER=1 with scripts/docker_gpu_shell_bootstrap.sh
      - INSTALL_STUDENT_SCORER=${INSTALL_STUDENT_SCORER:-0}
    volumes:
      - .:/app
      - ${PHOTOS_BIND_SOURCE:-/mnt/d/Photos}:/mnt/d/Photos:rw
      # Persist pip venvs + caches on Linux volumes (not NTFS /mnt)
      - gpu_shell_home:/root
      - hf_cache:/root/.cache/huggingface
      - torch_cache:/root/.cache/torch
    # Override image entrypoint (webui launch.py) — idle so docker exec stays available
    entrypoint: ["sleep", "infinity"]
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_e2e_data:
  gpu_shell_home:
  hf_cache:
  torch_cache:
