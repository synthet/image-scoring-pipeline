name: Docs Lint

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/okf_bundle.py'
      - 'scripts/okf_lint.py'
      - 'scripts/wiki_lint.py'
      - 'scripts/wiki_lint_scan.py'
      - 'scripts/ci/okf_lint_changed.py'
      - 'scripts/lint_docs_dependency_versions.py'
      - 'tests/test_okf_lint.py'
      - '.github/workflows/docs-lint.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/okf_bundle.py'
      - 'scripts/okf_lint.py'
      - 'scripts/wiki_lint.py'
      - 'scripts/wiki_lint_scan.py'
      - 'scripts/ci/okf_lint_changed.py'
      - 'scripts/lint_docs_dependency_versions.py'
      - 'tests/test_okf_lint.py'
      - '.github/workflows/docs-lint.yml'

jobs:
  docs-dependency-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint setup docs for dependency version drift
        run: python scripts/lint_docs_dependency_versions.py

  okf-bundle-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout gallery
        uses: actions/checkout@v4
        with:
          repository: synthet/image-scoring-gallery
          path: image-scoring-gallery
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OKF lint dependencies
        run: python -m pip install --upgrade pip pyyaml pytest

      - name: OKF linter unit tests
        run: python -m pytest tests/test_okf_lint.py -q

      - name: OKF lint gallery docs (full bundle)
        run: >
          python scripts/okf_lint.py image-scoring-gallery/docs
          --profile vexlum
          --bundle-name docs
          --fail-on error

      - name: Resolve git base for changed backend docs
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: OKF lint changed backend docs
        run: >
          python scripts/ci/okf_lint_changed.py
          --base "${{ steps.base.outputs.ref }}"
          --head "${{ github.sha }}"
          --profile vexlum
          --fail-on error
