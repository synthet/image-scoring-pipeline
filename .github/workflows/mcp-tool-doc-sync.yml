name: MCP Tool Doc Sync

on:
  pull_request:
    paths:
      - 'modules/mcp_server.py'
      - 'modules/mcp/**'
      - 'mcp/**'
      - 'modules/vexlum/**'
      - 'docs/reference/api/openapi.yaml'
      - 'docs/technical/MCP_DEBUGGING_TOOLS.md'
      - 'docs/technical/VEXLUM_MCP.md'
      - 'scripts/generate_mcp_tool_inventory.py'
      - '.github/workflows/mcp-tool-doc-sync.yml'
  push:
    branches: [main]
    paths:
      - 'modules/mcp_server.py'
      - 'modules/mcp/**'
      - 'mcp/**'
      - 'modules/vexlum/**'
      - 'docs/reference/api/openapi.yaml'
      - 'docs/technical/MCP_DEBUGGING_TOOLS.md'
      - 'docs/technical/VEXLUM_MCP.md'
      - 'scripts/generate_mcp_tool_inventory.py'
      - '.github/workflows/mcp-tool-doc-sync.yml'

jobs:
  verify-mcp-tool-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Verify generated MCP tool inventory
        run: |
          python scripts/generate_mcp_tool_inventory.py --check-docs docs/technical/MCP_DEBUGGING_TOOLS.md

      - name: Verify action registry sync
        run: |
          python scripts/generate_mcp_tool_inventory.py --check-action-registry

      - name: Verify vexlum catalog block
        run: |
          python scripts/generate_mcp_tool_inventory.py --check-vexlum-doc

      - name: Lint MCP doc vocabulary
        run: |
          python scripts/lint_mcp_doc_vocabulary.py --error
