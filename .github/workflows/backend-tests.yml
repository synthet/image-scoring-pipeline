name: Backend tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend-pytest-fast:
    name: backend-pytest-fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/requirements_ci.txt
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements_ci.txt
      - name: Run fast pytest smoke slice
        # Invoked via `bash` (like the `python scripts/ci/...` step below) so a
        # missing executable bit cannot break the gate — the repo is developed on a
        # Windows host, where the mode is easily dropped.
        run: bash scripts/ci/run_fast_smoke_tests.sh

  api-contract:
    name: api-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/requirements_ci.txt
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements_ci.txt
      # validate-api-types.yml proves electron/apiTypes.ts matches openapi.json.
      # This proves openapi.json still matches modules/api/routers/ — without it,
      # a new route reaches neither the spec nor image-scoring-gallery's types.
      - name: Check API route parity against openapi.json
        run: python scripts/ci/contract_check.py
