name: Frontend tests

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-test.yml'
  merge_group:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-test.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        # frontend/package.json links @synthet/image-scoring-design as file:../../image-scoring-ui,
        # so both repos are checked out side by side inside the workspace.
        working-directory: image-scoring-backend/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: image-scoring-backend

      - name: Checkout design package (image-scoring-ui)
        uses: actions/checkout@v4
        with:
          repository: synthet/image-scoring-ui
          path: image-scoring-ui

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: image-scoring-backend/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
