name: Validate API Types

on:
  pull_request:
  merge_group:

jobs:
  api-types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install tooling
        run: npm ci

      - name: Verify generated API types are committed
        run: npm run api:types:check
