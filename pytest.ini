[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Standard ignores for Windows to prevent collection errors and skip problematic scripts
norecursedirs =
    FirebirdLinux
    scripts/python
    .git
    .venv*
    docs
    static
    temp_test_*
    tests/archive_firebird
    *.FDB
    *.fdb


markers =
    gpu: tests that require a GPU
    db: tests that require a database connection
    ml: tests that require machine learning dependencies (TF, PyTorch, pyiqa, etc.)
    wsl: Tests intended to be run in WSL/Linux
    network: Tests that require outbound network access
    sample_data: Tests that require local sample files
    postgres: API/integration E2E in tests/integration/*_e2e.py — opt-in: RUN_POSTGRES_TESTS=1 or pytest -m postgres (see AGENTS.md § Pytest E2E vocabulary)
    inference_e2e: Docker inference E2E — live HTTP + GPU stack in CUDA image; opt-in IMAGE_SCORING_DOCKER_INFERENCE_E2E=1 (see AGENTS.md § Pytest E2E vocabulary)
